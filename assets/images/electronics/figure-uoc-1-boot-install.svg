<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <style>.title{font:700 32px Arial,"Noto Sans SC",sans-serif;fill:#102a43}.h{font:700 21px Arial,"Noto Sans SC",sans-serif;fill:#102a43}.t{font:17px Arial,"Noto Sans SC",sans-serif;fill:#334e68}.small{font:15px Arial,"Noto Sans SC",sans-serif;fill:#486581}.box{fill:#fff;stroke:#829ab1;stroke-width:3}.accent{fill:#e8f3ff;stroke:#1473e6;stroke-width:3}.warn{fill:#fff1f0;stroke:#d64545;stroke-width:3}.line{fill:none;stroke:#1473e6;stroke-width:5}</style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1473e6"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#f5f9fc"/><text x="55" y="60" class="title">从按下电源键到进入 Ubuntu：谁负责哪一步</text>
  <g transform="translate(55 120)"><rect width="180" height="120" rx="18" class="box"/><text x="48" y="48" class="h">硬件上电</text><text x="28" y="82" class="t">CPU、内存、硬盘</text></g>
  <g transform="translate(290 120)"><rect width="180" height="120" rx="18" class="accent"/><text x="60" y="48" class="h">UEFI</text><text x="25" y="82" class="t">检查硬件并找启动项</text></g>
  <g transform="translate(525 120)"><rect width="180" height="120" rx="18" class="box"/><text x="42" y="48" class="h">启动介质</text><text x="25" y="82" class="t">硬盘或启动 U 盘</text></g>
  <g transform="translate(760 120)"><rect width="180" height="120" rx="18" class="accent"/><text x="48" y="48" class="h">操作系统</text><text x="38" y="82" class="t">加载 Ubuntu</text></g>
  <g transform="translate(995 120)"><rect width="150" height="120" rx="18" class="box"/><text x="37" y="48" class="h">应用程序</text><text x="24" y="82" class="t">终端、编辑器</text></g>
  <path d="M235 180H290M470 180H525M705 180H760M940 180H995" class="line" marker-end="url(#a)"/>
  <text x="55" y="315" class="h">安装介质的形成</text>
  <g transform="translate(55 345)"><rect width="220" height="90" rx="15" class="box"/><text x="60" y="38" class="h">Ubuntu ISO</text><text x="28" y="68" class="small">安装系统所需文件的镜像</text></g>
  <g transform="translate(355 345)"><rect width="220" height="90" rx="15" class="accent"/><text x="53" y="38" class="h">镜像写入工具</text><text x="33" y="68" class="small">按磁盘结构写入，不是复制</text></g>
  <g transform="translate(655 345)"><rect width="220" height="90" rx="15" class="box"/><text x="66" y="38" class="h">启动 U 盘</text><text x="30" y="68" class="small">UEFI 可以从它启动安装器</text></g>
  <path d="M275 390H355M575 390H655" class="line" marker-end="url(#a)"/>
  <rect x="55" y="500" width="1090" height="120" rx="18" class="warn"/><text x="90" y="545" class="h" fill="#b42318">独占安装的关键含义</text><text x="90" y="580" class="t">安装器会重新组织目标硬盘的分区和文件系统；选择“擦除磁盘”后，原系统和文件通常不可恢复。</text><text x="90" y="610" class="t">因此必须先验证备份，再核对硬盘型号和容量；不确定时停止，不能猜。</text>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs><style>.title{font:700 32px Arial,"Noto Sans SC",sans-serif;fill:#102a43}.h{font:700 22px Arial,"Noto Sans SC",sans-serif;fill:#102a43}.t{font:18px Arial,"Noto Sans SC",sans-serif;fill:#334e68}.core{fill:#1473e6;stroke:#0757b5;stroke-width:4}.box{fill:#fff;stroke:#829ab1;stroke-width:3}.line{fill:none;stroke:#1473e6;stroke-width:5}.power{fill:none;stroke:#f59e0b;stroke-width:6}.note{fill:#e8f3ff;stroke:#1473e6;stroke-width:2}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1473e6"/></marker></defs>
  <rect width="1200" height="700" fill="#f5f9fc"/><text x="55" y="62" class="title">单片机最小系统：先保证“能稳定运行、能下载、能调试”</text>
  <rect x="450" y="220" width="300" height="260" rx="28" class="core"/><text x="520" y="330" font-family="Arial,Noto Sans SC,sans-serif" font-size="36" font-weight="700" fill="#fff">MCU</text><text x="485" y="375" font-family="Arial,Noto Sans SC,sans-serif" font-size="20" fill="#fff">CPU + 存储器 + 外设</text>
  <rect x="70" y="120" width="290" height="125" rx="16" class="box"/><text x="100" y="160" class="h">供电与去耦</text><text x="100" y="195" class="t">稳压、电源脚、GND</text><text x="100" y="225" class="t">去耦电容靠近芯片</text><path d="M360 182 H450" class="power"/>
  <rect x="70" y="300" width="290" height="110" rx="16" class="box"/><text x="100" y="342" class="h">复位</text><text x="100" y="378" class="t">上电复位 / 手动复位</text><path d="M360 355 H450" class="line" marker-end="url(#a)"/>
  <rect x="70" y="470" width="290" height="110" rx="16" class="box"/><text x="100" y="512" class="h">时钟</text><text x="100" y="548" class="t">内部或外部时钟源</text><path d="M360 525 H450" class="line" marker-end="url(#a)"/>
  <rect x="840" y="120" width="290" height="125" rx="16" class="box"/><text x="870" y="160" class="h">下载与调试</text><text x="870" y="195" class="t">SWD / JTAG / Boot</text><text x="870" y="225" class="t">接口引出并共地</text><path d="M750 182 H840" class="line" marker-end="url(#a)"/>
  <rect x="840" y="300" width="290" height="110" rx="16" class="box"/><text x="870" y="342" class="h">启动配置</text><text x="870" y="378" class="t">Boot 电平不得悬空</text><path d="M750 355 H840" class="line" marker-end="url(#a)"/>
  <rect x="840" y="470" width="290" height="110" rx="16" class="box"/><text x="870" y="512" class="h">基础接口</text><text x="870" y="548" class="t">GPIO、UART、状态灯</text><path d="M750 525 H840" class="line" marker-end="url(#a)"/>
  <rect x="160" y="620" width="880" height="52" rx="12" class="note"/><text x="205" y="653" class="t">元件取值、引脚功能和上电条件以具体器件数据手册与参考设计为准。</text>
</svg>

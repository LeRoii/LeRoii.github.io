<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs><style>.title{font:700 32px Arial,"Noto Sans SC",sans-serif;fill:#102a43}.h{font:700 21px Arial,"Noto Sans SC",sans-serif;fill:#102a43}.t{font:17px Arial,"Noto Sans SC",sans-serif;fill:#334e68}.small{font:15px Arial,"Noto Sans SC",sans-serif;fill:#486581}.box{fill:#fff;stroke:#829ab1;stroke-width:3}.accent{fill:#e8f3ff;stroke:#1473e6;stroke-width:3}.tool{fill:#fff4e5;stroke:#f59e0b;stroke-width:3}.line{fill:none;stroke:#1473e6;stroke-width:5}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1473e6"/></marker></defs>
  <rect width="1200" height="680" fill="#f5f9fc"/><text x="55" y="60" class="title">OpenCV 基础工程：一张图片如何变成三张结果图</text>
  <g transform="translate(40 125)"><rect width="190" height="130" rx="18" class="box"/><text x="55" y="45" class="h">input.jpg</text><rect x="45" y="65" width="100" height="40" fill="#1473e6"/><circle cx="75" cy="85" r="18" fill="#f59e0b"/></g>
  <g transform="translate(275 125)"><rect width="190" height="130" rx="18" class="accent"/><text x="43" y="45" class="h">cv::imread</text><text x="38" y="78" class="small">解码文件为 cv::Mat</text><text x="30" y="105" class="small">常见彩色顺序：BGR</text></g>
  <g transform="translate(510 125)"><rect width="190" height="130" rx="18" class="accent"/><text x="40" y="45" class="h">转为灰度</text><text x="32" y="78" class="small">3 通道 → 1 通道</text><text x="42" y="105" class="small">保留亮度信息</text></g>
  <g transform="translate(745 125)"><rect width="190" height="130" rx="18" class="accent"/><text x="35" y="45" class="h">高斯模糊</text><text x="35" y="78" class="small">减弱噪声和细碎变化</text><text x="47" y="105" class="small">为检测做准备</text></g>
  <g transform="translate(980 125)"><rect width="180" height="130" rx="18" class="tool"/><text x="45" y="45" class="h">Canny</text><text x="25" y="78" class="small">寻找亮度变化明显处</text><text x="44" y="105" class="small">输出边缘图</text></g>
  <path d="M230 190H275M465 190H510M700 190H745M935 190H980" class="line" marker-end="url(#a)"/>
  <text x="55" y="335" class="h">如何理解 cv::Mat</text>
  <rect x="55" y="365" width="470" height="220" rx="18" class="box"/><text x="90" y="405" class="t">图像可以看成规则排列的像素矩阵。</text><text x="90" y="442" class="t">行 × 列：图像高度 × 宽度。</text><text x="90" y="479" class="t">每个像素可有 1 个灰度值或多个颜色通道。</text><text x="90" y="516" class="t">cv::Mat 保存尺寸、类型、步长和像素数据。</text><text x="90" y="553" class="small">它不只是“图片文件名”，而是程序内存中的数据对象。</text>
  <text x="590" y="335" class="h">为什么先模糊再检测边缘</text>
  <rect x="590" y="365" width="570" height="220" rx="18" class="box"/><text x="625" y="405" class="t">真实图片含有纹理、压缩痕迹和传感器噪声。</text><text x="625" y="442" class="t">边缘算法会把快速亮度变化当作候选边缘。</text><text x="625" y="479" class="t">先适度平滑，可减少无意义的小变化。</text><text x="625" y="516" class="t">阈值过低会得到太多边缘，过高会漏掉目标。</text><text x="625" y="553" class="small">处理流程是有因果关系的，不是随意堆叠函数。</text>
  <text x="55" y="635" class="t">最终由 cv::imwrite 把内存中的矩阵重新编码为 gray.jpg、blurred.jpg 和 edges.jpg。</text>
</svg>


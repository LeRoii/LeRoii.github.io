<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs><style>.title{font:700 32px Arial,"Noto Sans SC",sans-serif;fill:#102a43}.h{font:700 22px Arial,"Noto Sans SC",sans-serif;fill:#102a43}.t{font:18px Arial,"Noto Sans SC",sans-serif;fill:#334e68}.small{font:15px Arial,"Noto Sans SC",sans-serif;fill:#486581}.box{fill:#fff;stroke:#829ab1;stroke-width:3}.wire1{fill:none;stroke:#1473e6;stroke-width:7}.wire2{fill:none;stroke:#f59e0b;stroke-width:7}.gnd{fill:none;stroke:#243b53;stroke-width:6}.bit{fill:#e8f3ff;stroke:#1473e6;stroke-width:2}.mark{fill:#fff4e5;stroke:#f59e0b;stroke-width:2}</style><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1473e6"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#f59e0b"/></marker></defs>
  <rect width="1200" height="700" fill="#f5f9fc"/><text x="55" y="60" class="title">UART：交叉连接、共地、参数一致</text>
  <rect x="90" y="110" width="300" height="230" rx="22" class="box"/><text x="205" y="155" class="h">设备 A</text><text x="300" y="205" class="t">TX</text><text x="300" y="255" class="t">RX</text><text x="288" y="305" class="t">GND</text>
  <rect x="810" y="110" width="300" height="230" rx="22" class="box"/><text x="925" y="155" class="h">设备 B</text><text x="835" y="205" class="t">RX</text><text x="835" y="255" class="t">TX</text><text x="835" y="305" class="t">GND</text>
  <path d="M390 198 C550 150 650 150 810 198" class="wire1" marker-end="url(#b)"/><path d="M810 248 C650 300 550 300 390 248" class="wire2" marker-end="url(#o)"/><path d="M390 298 H810" class="gnd"/>
  <text x="488" y="190" class="small">TX → RX</text><text x="488" y="290" class="small">RX ← TX</text><text x="535" y="326" class="small">GND ↔ GND</text>
  <text x="55" y="405" class="h">典型 8N1 数据帧（空闲为高）</text>
  <g transform="translate(60,445)"><rect width="105" height="90" class="bit"/><rect x="105" width="105" height="90" class="mark"/><rect x="210" width="105" height="90" class="bit"/><rect x="315" width="105" height="90" class="bit"/><rect x="420" width="105" height="90" class="bit"/><rect x="525" width="105" height="90" class="bit"/><rect x="630" width="105" height="90" class="bit"/><rect x="735" width="105" height="90" class="bit"/><rect x="840" width="105" height="90" class="bit"/><rect x="945" width="105" height="90" class="mark"/>
  <text x="25" y="55" class="t">空闲</text><text x="127" y="55" class="t">起始</text><text x="232" y="55" class="t">D0</text><text x="337" y="55" class="t">D1</text><text x="442" y="55" class="t">D2</text><text x="547" y="55" class="t">D3</text><text x="652" y="55" class="t">D4</text><text x="757" y="55" class="t">D5</text><text x="862" y="55" class="t">D6/D7</text><text x="968" y="55" class="t">停止</text></g>
  <path d="M60 585 H165 V615 H270 V585 H375 V615 H480 V585 H690 V615 H795 V585 H1110" fill="none" stroke="#1473e6" stroke-width="6"/>
  <text x="60" y="665" class="t">波特率、数据位、校验位、停止位必须一致；TTL/CMOS UART 不能直接接 RS-232 电平。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      .title{font:700 32px Arial,"Noto Sans SC",sans-serif;fill:#102a43}.h{font:700 22px Arial,"Noto Sans SC",sans-serif;fill:#102a43}.t{font:18px Arial,"Noto Sans SC",sans-serif;fill:#334e68}.small{font:16px Arial,"Noto Sans SC",sans-serif;fill:#486581}.box{fill:#fff;stroke:#829ab1;stroke-width:3}.wire{fill:none;stroke:#1473e6;stroke-width:7;stroke-linecap:round}.gnd{fill:none;stroke:#243b53;stroke-width:6;stroke-linecap:round}.danger{fill:none;stroke:#d64545;stroke-width:7;stroke-linecap:round}.ok{fill:#e8f3ff;stroke:#1473e6;stroke-width:2}.warn{fill:#fff4e5;stroke:#f59e0b;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1473e6"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#f5f9fc"/>
  <text x="60" y="65" class="title">示波器探头：信号端测节点，地夹接电路参考地</text>
  <rect x="60" y="115" width="470" height="430" rx="20" class="box"/>
  <text x="90" y="155" class="h">低压被测电路</text>
  <circle cx="190" cy="300" r="12" fill="#1473e6"/><text x="105" y="290" class="t">信号点</text>
  <path d="M190 300 H390" class="wire"/><path d="M390 300 V430 H250" class="wire"/>
  <rect x="260" y="270" width="90" height="60" rx="8" class="ok"/><text x="282" y="307" class="t">MCU</text>
  <circle cx="250" cy="430" r="12" fill="#243b53"/><text x="105" y="438" class="t">电路 GND</text>
  <path d="M250 430 V465 M215 465 H285 M225 482 H275 M238 499 H262" class="gnd"/>
  <rect x="650" y="130" width="450" height="335" rx="22" class="box"/>
  <text x="685" y="175" class="h">普通台式示波器</text>
  <rect x="690" y="205" width="260" height="175" rx="10" fill="#102a43"/>
  <path d="M715 300 L755 300 L770 255 L800 340 L825 275 L850 300 L925 300" class="wire"/>
  <circle cx="1020" cy="250" r="18" fill="#1473e6"/><text x="985" y="300" class="small">CH1</text>
  <circle cx="1020" cy="350" r="18" fill="#243b53"/><text x="990" y="400" class="small">GND</text>
  <path d="M1020 250 C850 70 420 95 190 300" class="wire" marker-end="url(#arrow)"/>
  <path d="M1020 350 C790 600 470 590 250 430" class="gnd"/>
  <text x="610" y="560" class="t">地夹通常与保护地相连：夹错位置可能造成短路。</text>
  <rect x="60" y="585" width="1040" height="78" rx="14" class="warn"/>
  <text x="90" y="618" class="h">安全边界</text>
  <text x="230" y="618" class="t">初学阶段只测安全低压共地电路；不得直接测市电、未知高压或浮地高端。</text>
  <path d="M86 638 L110 662 M110 638 L86 662" class="danger"/>
</svg>

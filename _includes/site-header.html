      <span>a simple personal daily notebook, to remember some stuff</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a{% if page.section == 'workshop' %} class="is-active" aria-current="page"{% endif %} href="{{ '/workshop/' | relative_url }}">电子创新工作室资料</a>
      <a{% if page.section == 'archive' %} class="is-active" aria-current="page"{% endif %} href="{{ '/archive/' | relative_url }}">过往资料</a>
